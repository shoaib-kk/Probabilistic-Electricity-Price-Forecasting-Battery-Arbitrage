name: live-paper-trading-tick

on:
  schedule:
    # Every 30 minutes, offset so freshly settled AEMO data has landed.
    - cron: "7,37 * * * *"
  workflow_dispatch: {}

concurrency:
  group: live-tick
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Restore live artifacts from live-data branch
        run: |
          if git fetch origin live-data 2>/dev/null; then
            git checkout FETCH_HEAD -- artifacts/live || true
            echo "Restored artifacts/live from live-data branch"
          else
            echo "No live-data branch yet; using seeded artifacts from main"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-live.txt

      - name: Install dependencies
        run: pip install -r requirements-live.txt

      - name: Run live tick
        run: python scripts/live_tick.py

      - name: Publish artifacts to live-data branch
        run: |
          git config user.name "live-tick-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f artifacts/live
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "live tick $(date -u +%FT%TZ)"
          git push --force origin HEAD:live-data
